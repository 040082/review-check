<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국폴리텍대학 교육운영계획서 검토 지원 프로그램</title>
<style>
:root{--navy:#0b2a5b;--navy2:#071a3a;--teal:#2dd4bf;--ok:#16a34a;--bad:#dc2626;--chk:#d97706;--line:#d9e1ec}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;color:#0f172a;min-height:100vh;
 background:radial-gradient(1200px 700px at 85% -10%,#1d4f9c 0%,rgba(11,42,91,0) 60%),linear-gradient(160deg,#0b2a5b,#071a3a);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.screen{display:none}.screen.on{display:block}
h1{color:#fff;font-size:30px;line-height:1.3;margin:6px 0 4px}h1 em{font-style:normal;color:var(--teal)}
.sub{color:#b9c8e3;margin:0 0 26px}
.tag{display:inline-block;color:var(--teal);border:1px solid rgba(45,212,191,.5);border-radius:99px;padding:3px 12px;font-size:13px;margin-bottom:8px}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.big{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:34px 26px;color:#fff;cursor:pointer;backdrop-filter:blur(6px);text-align:left;font:inherit;transition:.15s}
.big:hover{background:rgba(45,212,191,.15);border-color:var(--teal);transform:translateY(-2px)}
.big b{display:block;font-size:24px;margin-bottom:8px}.big span{color:#b9c8e3;font-size:14px}
.links{margin-top:30px;text-align:center}.links a{color:#b9c8e3;margin:0 14px;cursor:pointer;text-decoration:underline}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar h2{color:#fff;margin:0;font-size:22px;flex:1}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.card h3{margin:0 0 12px;font-size:17px}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px;color:#fff;margin-bottom:16px}
button.b{background:linear-gradient(90deg,#14b8a6,#2563eb);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.g{background:#eef2f7;color:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
button.g.light{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
button.d{background:#fff;color:var(--bad);border:1px solid #f0b4b4;border-radius:8px;padding:4px 9px;font:inherit;cursor:pointer}
button.mini{padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:#f8fafc;cursor:pointer;font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px 10px 0 0;padding:9px 16px;font:inherit;cursor:pointer}
.tabs button.on{background:#fff;color:var(--navy);font-weight:700}
label.f{display:block;font-size:13px;color:#475569;margin:0 0 3px}
input[type=text],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid #c5d0e0;border-radius:8px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
th{background:#eef4fb;white-space:nowrap}
td input[type=text],td select{padding:5px 6px;min-width:60px}
.note{font-size:13px;color:#64748b;margin:6px 0}
.hint{background:#fff7e6;border:1px solid #fcd9a0;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.drop{border:2px dashed #94a3b8;border-radius:14px;padding:30px;text-align:center;background:#f8fafc;cursor:pointer}
.drop.over{border-color:var(--teal);background:#e6fbf7}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13px}
.pill.ok{background:var(--ok)}.pill.bad{background:var(--bad)}.pill.chk{background:var(--chk)}
tr.v-ok td:first-child{border-left:5px solid var(--ok)}tr.v-bad td:first-child{border-left:5px solid var(--bad)}tr.v-chk td:first-child{border-left:5px solid var(--chk)}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sum div{flex:1;min-width:110px;background:#f1f5f9;border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px}
.warn{background:#fff7e6;border:1px solid #fcd9a0;color:#7a4b00;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13.5px}
.err{background:#fde8e8;border:1px solid #f4b5b5;color:#8a1c1c;border-radius:8px;padding:8px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}.modal .box{background:#fff;border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal .box.wide{max-width:1000px}
.msg{min-height:20px;font-size:14px;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:99}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.bigs,.row2{grid-template-columns:1fr}h1{font-size:23px}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff}body.printing .screen,body.printing .modal,body.printing #toast{display:none!important}
 body.printing #printArea{display:block!important}
 #printArea{color:#000}#printArea table{font-size:10.5px}
}
#printArea{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- 1. 메인 -->
<section id="s-main" class="screen on">
  <span class="tag">직업교육과정 검수</span>
  <h1>한국폴리텍대학<br><em>교육운영계획서 검토 지원 프로그램</em></h1>
  <p class="sub">검수할 과정을 선택하세요. 교육운영계획서 PDF를 읽어 2027학년도 세부기준대로 작성 여부를 확인합니다.</p>
  <div class="bigs">
    <button class="big" onclick="openCourse('general')"><b>일반계고위탁과정</b><span>세부기준 설정 · 교과과정 체크하기</span></button>
    <button class="big" onclick="openCourse('gineungjang')"><b>기능장 과정</b><span>세부기준 설정 · 교과과정 체크하기</span></button>
  </div>
  <div class="links"><a onclick="gotoHistory()">검수 내역</a><a onclick="adminGate('admin-home')">관리자</a></div>
</section>

<!-- 2. 과정 상세 -->
<section id="s-course" class="screen">
  <div class="topbar"><h2 id="courseTitle"></h2><button class="g light" onclick="show('s-main')">메인으로</button></div>
  <div class="bigs">
    <button class="big" onclick="adminGate('criteria')"><b>세부기준 설정</b><span>관리자 로그인 후 검수 기준을 입력합니다</span></button>
    <button class="big" onclick="openCheck()"><b>교과과정 체크하기</b><span>교육운영계획서 PDF를 올려 검수합니다</span></button>
  </div>
</section>

<!-- 3-a. 관리자 홈 -->
<section id="s-admin-home" class="screen">
  <div class="topbar"><h2>관리자</h2><button class="g light" onclick="logout()">로그아웃</button><button class="g light" onclick="show('s-main')">메인으로</button></div>
  <div class="bigs">
    <button class="big" onclick="show('s-pick')"><b>세부기준 설정</b><span>기능장 / 일반계고위탁 기준 입력</span></button>
    <button class="big" onclick="gotoHistory()"><b>검수 내역</b><span>저장된 검수 결과 조회</span></button>
  </div>
</section>

<!-- 3-b. 과정 선택 (관리자) -->
<section id="s-pick" class="screen">
  <div class="topbar"><h2>세부기준을 설정할 과정 선택</h2><button class="g light" onclick="show('s-main')">메인으로</button></div>
  <div class="bigs">
    <button class="big" onclick="openCriteria('gineungjang')"><b>기능장 과정</b><span>세부기준 입력</span></button>
    <button class="big" onclick="openCriteria('general')"><b>일반계고위탁과정</b><span>세부기준 입력</span></button>
  </div>
</section>

<!-- 3-c. 기준 입력 -->
<section id="s-criteria" class="screen">
  <div class="topbar"><h2 id="critTitle"></h2>
    <button class="b" id="btnSaveCrit" onclick="saveCrit()">저장</button>
    <button class="g light" onclick="loadDefaultCrit()">기본값 불러오기</button>
    <button class="g light" onclick="cancelCrit()">변경 취소</button>
    <button class="g light" onclick="show('s-pick')">과정 선택</button></div>
  <div class="msg" id="critMsg" style="color:#fff"></div>
  <div class="tabs" id="critTabs"></div>
  <div id="critBody"></div>
</section>

<!-- 4. 검수 -->
<section id="s-check" class="screen">
  <div class="topbar"><h2 id="checkTitle"></h2><button class="g light" onclick="openCourse(curCourse)">뒤로</button><button class="g light" onclick="show('s-main')">메인으로</button></div>
  <div class="card">
    <h3>1. 검수 대상 정보</h3>
    <div class="grid">
      <div><label class="f">캠퍼스</label><select id="cCampus"><option value="">선택</option></select></div>
      <div><label class="f">학과</label><input type="text" id="cDept"></div>
      <div><label class="f">담당자명</label><input type="text" id="cMgr"></div>
      <div><label class="f">편성 유형</label><select id="cType"></select></div>
    </div>
    <div class="note">PDF를 읽으면 캠퍼스와 학과가 자동으로 채워집니다. 틀리면 직접 고치세요.</div>
  </div>
  <div class="card">
    <h3>2. 교육운영계획서 PDF</h3>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <b>PDF 파일을 여기에 끌어 놓거나 클릭해서 선택하세요</b>
      <div class="note" id="fileInfo">선택된 파일 없음</div>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" style="display:none">
    <div style="margin-top:12px"><button class="b" id="btnRead" onclick="readPdf()" disabled>교과과정 읽어오기</button>
      <span id="readProg" class="note"></span></div>
    <div id="readOut"></div>
  </div>
  <div class="card" id="runCard" style="display:none">
    <button class="b" id="btnRun" onclick="runCheck()">검수 실행</button>
    <span class="note">기준 버전: <span id="critVer">-</span></span>
  </div>
  <div class="card" id="resCard" style="display:none"></div>
</section>

<!-- 5. 검수 내역 -->
<section id="s-history" class="screen">
  <div class="topbar"><h2>검수 내역</h2><button class="g light" onclick="logout();show('s-main')">로그아웃</button><button class="g light" onclick="show('s-main')">메인으로</button></div>
  <div class="card">
    <div class="grid">
      <div><label class="f">과정</label><select id="hCourse"><option value="">전체</option><option>일반계고위탁과정</option><option>기능장 과정</option></select></div>
      <div><label class="f">캠퍼스</label><select id="hCampus"><option value="">전체</option></select></div>
      <div><label class="f">판정</label><select id="hVerdict"><option value="">전체</option><option>적합</option><option>부적합</option><option>확인필요</option></select></div>
      <div><label class="f">시작일</label><input type="text" id="hFrom" placeholder="2026-11-01"></div>
      <div><label class="f">종료일</label><input type="text" id="hTo" placeholder="2026-11-30"></div>
      <div><label class="f">검색어(학과·담당자·번호)</label><input type="text" id="hQ"></div>
    </div>
    <div style="margin-top:10px"><button class="b" onclick="renderHistory()">조회</button> <button class="g" onclick="historyCsv()">CSV 다운로드</button> <span class="note" id="hCount"></span></div>
  </div>
  <div class="card tw"><table id="hTable"></table></div>
</section>
</div>

<!-- 로그인 모달 -->
<div class="modal" id="mLogin"><div class="box">
  <h3 style="margin-top:0">관리자 로그인</h3>
  <label class="f">관리자 비밀번호</label><input type="password" id="pw" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="msg" id="loginMsg"></div>
  <div style="margin-top:10px;display:flex;gap:8px"><button class="b" id="btnLogin" onclick="doLogin()">로그인</button><button class="g" onclick="closeLogin()">취소</button></div>
</div></div>
<!-- 상세 모달 -->
<div class="modal" id="mDetail"><div class="box wide"><div id="detailBody"></div><div style="margin-top:12px"><button class="g" onclick="document.getElementById('mDetail').classList.remove('on')">닫기</button></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ============================================================
   ★ 여기 한 곳만 고치세요: Apps Script 웹 앱 주소(…/exec)
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycby8N1qY0F-_oR0ZXkSH2hR4_ObJaRY-HXIJJ13j5telu93xZwRKnsrb4YkrdGcoA1AVBQ/exec";

/* ===== 기본 기준값 (2027학년도 세부기준 붙임 4·5 기준) =====
   관리자 화면의 [기본값 불러오기]가 이 값을 사용합니다. 화면에서 고치고 [저장]하면 "기준" 시트에 저장됩니다. */
function defaultCriteria_(course) {
  var AI9 = 'AI리터러시,생성형AI,AI활용,AI코딩,피지컬AI이해,멀티모달AI,바이브코딩,데이터분석및시각화,AI에이전트';
  var common = function (id, name, method, desc, use) { return { id: id, name: name, method: method, desc: desc, use: use }; };
  if (course === 'gineungjang') {

      basic: {

        { name: '공업경영일반', keywords: '', minH: 32, maxH: '', term: '', required: true }
      ],
      topics: [
        { label: '직업윤리 필수 교수요목(기업경영과 사회적기업 2h)', courses: '직업윤리', keywords: '기업경영,사회적기업', hours: 2 }
      ],
      groups: {

        safety: { use: true, names: '', keywords: '산업안전', minH: 16, maxH: '', allowedTerms: '2,3,4', forbiddenTerms: '1', onlineMin: 6, extraNames: '' },

      },

        { cat: '교직', name: 'NCS이해및활용', minH: 32, maxH: 32, term: '', required: true, basis: '기준서 교직교과 2학점', note: '야간1년 1-2학기 / 야간2년 2-2학기' },

        { cat: '교직', name: 'NCS역량평가', minH: 48, maxH: 48, term: '', required: true, basis: '기준서 교직교과 3학점', note: '' }

      checklist: [

        common('ratio', '이론/실습 비율 허용오차 이내', 'auto', '이론 40% 실습 60% ±허용오차', true),
        common('credits_by_cat', '구분별 편성학점(교양·기초기술·교직·전공)', 'auto', '편성 유형별 학점 비교', true),
        common('semester_credits', '학기별 수강학점 범위', 'auto', '로드맵 총계행 기준', true),
        common('required', '필수 편성교과(시간·학기)', 'auto', '필수 편성교과와 교과목 편성기준 표', true),

        common('industry_ai', '산업AI 교과 편성', 'auto', '20~40h 필수', true),
        common('credit_range', '과목당 학점 범위', 'auto', '과목당 1~4학점', true),
        common('name_format', '신규 교과명 형식', 'auto', '숫자·특수문자·10자 초과', true),
        common('dup_names', '교과명 중복 없음', 'auto', '', true),

/* ====== 핵심 로직 (화면과 분리된 순수 함수) : PDF 읽기 + 검수 ====== */
var nz = function (s) { return String(s == null ? '' : s).replace(/[\s\u00a0]+/g, ''); };
var isNum = function (s) { return /^\d+$/.test(nz(s)); };
var CODE_RE = /^\d{8,10}_\d{2}v\d+$/;

/* pdf.js 글자 조각(items)을 "행(row)"과 "칸(cell)"으로 묶는다 */
function buildRows(items) {
  var its = [];
  items.forEach(function (i) {
    if (i.str && i.str.trim()) its.push({ s: i.str, x: i.transform[4], w: i.width || 0, y: i.transform[5] });
  });
  its.sort(function (a, b) { return b.y - a.y; });
  var rows = [];
  its.forEach(function (it) {
    var r = null;
    for (var k = rows.length - 1; k >= 0 && k >= rows.length - 4; k--) { if (Math.abs(rows[k].y - it.y) <= 4) { r = rows[k]; break; } }
    if (!r) { r = { y: it.y, items: [] }; rows.push(r); }
    r.items.push(it);
  });
  rows.forEach(function (r) {
    r.items.sort(function (a, b) { return a.x - b.x; });
    r.cells = [];
    r.items.forEach(function (it) {
      var last = r.cells[r.cells.length - 1];
      var chars = [];
      var L = it.s.length;
      for (var k = 0; k < L; k++) chars.push({ c: it.s[k], x: it.x + it.w * k / L });
      if (last && it.x - last.x2 <= Math.max(7, 0.7 * it.w)) {
        last.s += it.s; last.x2 = it.x + it.w; last.ch = last.ch.concat(chars);
      } else {
        r.cells.push({ s: it.s, x: it.x, x2: it.x + it.w, ch: chars });
      }
    });
    r.text = nz(r.cells.map(function (c) { return c.s; }).join(''));
  });
  return rows;
}

function catKind(cat) {
  var c = nz(cat);
  if (/교양/.test(c)) return '교양';
  if (/기초기술/.test(c)) return '기초기술';
  if (/교직/.test(c)) return '교직';
  if (/전공이론/.test(c)) return '전공이론';
  if (/전공실습|계열공통|특화전공|전공/.test(c)) return '전공실습';
  return '기타';
}

function sameName(a, b) {
  a = nz(a).replace(/人/g, ''); b = nz(b).replace(/人/g, '');
  if (!a || !b) return false;
  if (a === b) return true;
  return (a.length >= 4 && b.length >= 4) && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
}

/* ---------- PDF 전체 읽기 : pages = [rows, rows, ...] ---------- */
function parseDoc(pages) {
  var doc = { cover: {}, courses: [], aiRows: [], safetyRows: [], roadmap: { ok: false, courses: {}, totals: null }, gen: { ok: false, anchors: [] },
    ncs: { ok: false, byCourse: {}, all: [], dup: [] }, summary: null, warnings: [], pageCount: pages.length };

  /* 1) 표지 */
  var cv = doc.cover;
  [0, 1].forEach(function (pi) {
    (pages[pi] || []).forEach(function (r) {
      var t = r.text, m;
      if (pi === 0 && (m = t.match(/^과정[:：](.+)$/))) cv.course = m[1];
      if (pi === 0 && !cv.dept && (m = t.match(/^\((.+)\)$/))) cv.dept = m[1];
      if (!cv.campus && (m = t.match(/한국폴리텍대학(.+?)캠퍼스/))) cv.campus = m[1];
      if (!cv.period && (m = t.match(/(\d+)년\(([\d,]+)시간\)/))) { cv.period = m[0]; cv.hours = Number(m[2].replace(/,/g, '')); }
      if (!cv.level && (m = t.match(/Level(\d)/i))) cv.level = Number(m[1]);
      if (pi === 0 && !cv.track && (m = t.match(/^(직종|전공)[:：](.+)$/))) cv.track = m[2];
    });
  });
  if (!cv.course) {
    var t0 = pages[0] ? pages[0].map(function (r) { return r.text; }).join('|') : '';
    if (/기능장/.test(t0)) cv.course = '기능장'; else if (/일반계고/.test(t0)) cv.course = '일반계고위탁과정';
  }

  /* 2) 표(총괄표, AI·산업안전, 로드맵, 교과목구성, NCS)와 3) 교과목별 상세 페이지 */
  var sec = null, valXs = null, lastLabel = '';
  var rmOn = false, rmAnch = null, genOn = false, genStart = false, ncsOn = false;
  var G = [], N = [], curCourse = null, detailSeen = false;

  pages.forEach(function (rows, pi) {
    var isDetail = rows.some(function (r) { return r.cells.some(function (c) { return nz(c.s) === '교과목명'; }); }) &&
                   rows.some(function (r) { return r.cells.some(function (c) { return nz(c.s) === '대상학과'; }); });
    var isEval = rows.some(function (r) { return /수행평가서/.test(r.text); });
    if (isDetail) { detailSeen = true; curCourse = parseDetail(rows, pi, doc); return; }
    if (isEval) return;
    if (detailSeen) { if (curCourse) parsePlan(curCourse, rows); return; }

    rows.forEach(function (r) {
      var rt = r.text;
      var Y = pi * 2000 + (1000 - r.y);
      /* 일반계고 총괄표 : 1200(100%) 128(10.67%) ... */
      var pc = r.cells.filter(function (c) { return /^\d+\(\d+(\.\d+)?%\)$/.test(nz(c.s)); });
      if (pc.length >= 3 && !doc.summary) {
        var v = pc.map(function (c) { var m = nz(c.s).match(/^(\d+)\((\d+(?:\.\d+)?)%\)$/); return { h: Number(m[1]), p: Number(m[2]) }; });
        doc.summary = { total: v[0].h, theory: v[1].h, practice: v[2].h, theoryPct: v[1].p };
      }
      /* 제목 줄 → 구역 시작/끝 */
      if (/^([가-하]\.)?AI교과/.test(rt)) { sec = 'ai'; valXs = null; return; }
      if (/^([가-하]\.)?산업안전교과/.test(rt)) { sec = 'safety'; valXs = null; return; }
      if (/^\d\.교육훈련과정로드맵/.test(rt)) { rmOn = true; sec = null; return; }
      if (/^다\.교과목구성/.test(rt)) { genOn = true; sec = null; return; }
      if (/^\d\.훈련이수체계도/.test(rt)) { genOn = false; ncsOn = false; sec = null; return; }
      if (/^[가-하]\.전공교과/.test(rt)) { ncsOn = true; sec = null; return; }
      if (/^2\)NCS미적용/.test(rt)) { ncsOn = false; }
      if ((sec) && /^[가-하]\./.test(rt)) { sec = null; }

      if (sec === 'ai' || sec === 'safety') {
        var hdrT = r.cells.filter(function (c) { return /^\d학기$/.test(nz(c.s)); });
        if (hdrT.length >= 2) return;
        var vh = r.cells.filter(function (c) { return /^(학점|편성시간)$/.test(nz(c.s)); });
        if (vh.length >= 2) { valXs = vh.map(function (c) { return (c.x + c.x2) / 2; }); return; }
        if (!valXs) return;
        var labelCells = r.cells.filter(function (c) { return c.x < 60; });
        if (labelCells.length) lastLabel = nz(labelCells.map(function (c) { return c.s; }).join(''));
        var nums = r.cells.filter(function (c) { return c.x >= 60 && isNum(c.s); });
        var names = r.cells.filter(function (c) { return c.x >= 60 && !isNum(c.s) && !/^(구분|교과목명|학기)$/.test(nz(c.s)); });
        if (!nums.length || !names.length) return;
        nums.forEach(function (n) {
          var cx = (n.x + n.x2) / 2, bi = 0, bd = 1e9;
          valXs.forEach(function (vx, k) { if (Math.abs(vx - cx) < bd) { bd = Math.abs(vx - cx); bi = k; } });
          var nm;
          if (nums.length === 1) nm = names.map(function (c) { return nz(c.s); }).join('');
          else {
            var best = null, bdd = 1e9;
            names.forEach(function (c) { var d = Math.abs((c.x + c.x2) / 2 - cx); if (d < bdd) { bdd = d; best = c; } });
            nm = best ? nz(best.s) : '';
          }
          var kind = sec === 'safety' ? 'safety' : (/산업/.test(lastLabel) ? 'industryAI' : 'aiUse');
          (kind === 'safety' ? doc.safetyRows : doc.aiRows).push({ kind: kind, name: nm, term: bi + 1, val: Number(nz(n.s)) });
        });
        return;
      }

      if (rmOn) {
        var h2 = r.cells.filter(function (c) { return /^\d학기$/.test(nz(c.s)); });
        if (h2.length >= 2) { rmAnch = h2.map(function (c) { return c.x - 13; }); return; }
        if (!rmAnch) return;
        var numc = r.cells.filter(function (c) { return isNum(c.s); });
        var nonn = r.cells.filter(function (c) { return !isNum(c.s); });
        var vals = rmAnch.map(function (ax) {
          var f = numc.filter(function (c) { return Math.abs(c.x - ax) <= 8; })[0];
          return f ? Number(nz(f.s)) : 0;
        });
        var joined = nz(nonn.map(function (c) { return c.s; }).join(''));
        if (joined === '총계' && numc.length) { doc.roadmap.totals = vals; return; }
        var nm2 = nonn.filter(function (c) { return c.x >= 120 && c.x <= 215 && nz(c.s).length >= 2 && !/^(소계|총계)$/.test(nz(c.s)); })[0];
        if (nm2 && numc.length) {
          var terms = []; vals.forEach(function (v, k) { if (v > 0) terms.push(k + 1); });
          doc.roadmap.courses[nz(nm2.s)] = { terms: terms, credits: vals };
          doc.roadmap.ok = true;
        }
        return;
      }

      if (genOn) { G.push({ r: r, Y: Y }); return; }
      if (ncsOn) { N.push({ r: r, Y: Y }); return; }
    });
  });

  /* 일반계고 교과목구성 표 해석 */
  (function () {
    var started = false, rowsOK = [];
    G.forEach(function (g) {
      var sub = g.r.cells.some(function (c) { return /^(소계|총계)$/.test(nz(c.s)); });
      if (sub) { started = true; return; }
      if (!started) return;
      rowsOK.push(g);
    });
    var anchors = [];
    rowsOK.forEach(function (g) {
      var hc = g.r.cells.filter(function (c) { return isNum(c.s) && c.x >= 170 && c.x < 203; })[0];
      if (hc) anchors.push({ Y: g.Y, hours: Number(nz(hc.s)), name: '', parts: [], terms: [], codes: [] });
    });
    if (!anchors.length) return;
    var nearest = function (Y, lim) {
      var b = null, bd = 1e9; anchors.forEach(function (a) { var d = Math.abs(a.Y - Y); if (d < bd) { bd = d; b = a; } });
      return bd <= lim ? b : null;
    };
    rowsOK.forEach(function (g) {
      g.r.cells.forEach(function (c) {
        var txt = c.ch.filter(function (k) { return k.x >= 94 && k.x < 172; }).map(function (k) { return k.c; }).join('');
        if (txt && !isNum(txt)) { var a = nearest(g.Y, 14); if (a) a.parts.push({ Y: g.Y, t: txt }); }
        if (CODE_RE.test(nz(c.s))) { var a2 = nearest(g.Y, 70); if (a2) a2.codes.push(nz(c.s)); }
      });
      var tv = g.r.cells.filter(function (c) { return isNum(c.s) && c.x >= 470; });
      if (tv.length) {
        var a3 = nearest(g.Y, 70);
        if (a3) tv.forEach(function (c) { if (Number(nz(c.s)) > 0) { var t = c.x < 492 ? 1 : 2; if (a3.terms.indexOf(t) < 0) a3.terms.push(t); } });
      }
    });
    anchors.forEach(function (a) { a.parts.sort(function (p, q) { return p.Y - q.Y; }); a.name = nz(a.parts.map(function (p) { return p.t; }).join('')); });
    doc.gen = { ok: true, anchors: anchors.filter(function (a) { return a.name; }) };
    doc.gen.anchors.forEach(function (a) { if (a.codes.length) doc.ncs.byCourse[a.name] = a.codes; });
  })();

  /* 기능장 NCS 전공교과 표 해석 */
  (function () {
    if (!N.length) return;
    var anchors = [], units = [];
    var hdr = /^(교과목명|능력단위분류번호|능력단위명|학점|교육훈련시간|NCS|교과명|단원명)/;
    N.forEach(function (g) {
      g.r.cells.forEach(function (c) {
        var t = nz(c.s);
        if (CODE_RE.test(t)) units.push({ Y: g.Y, code: t });
        else if (c.x < 140 && !isNum(t) && t.length >= 2 && !hdr.test(t) && !/^\d\)/.test(t) && !/^[가-하]\./.test(t) && !/^(소계|총계)$/.test(t)) anchors.push({ Y: g.Y, name: t });
      });
    });
    units.forEach(function (u) {
      var b = null, bd = 1e9; anchors.forEach(function (a) { var d = Math.abs(a.Y - u.Y); if (d < bd) { bd = d; b = a; } });
      if (b && bd <= 70) { (doc.ncs.byCourse[b.name] = doc.ncs.byCourse[b.name] || []).push(u.code); }
    });
    doc.tableNcsCourses = anchors.map(function (a) { return a.name; });
  })();

  var all = [];
  Object.keys(doc.ncs.byCourse).forEach(function (k) { all = all.concat(doc.ncs.byCourse[k]); });
  doc.ncs.all = all; doc.ncs.ok = all.length > 0;
  var seen = {}; all.forEach(function (c) { if (seen[c]) { if (doc.ncs.dup.indexOf(c) < 0) doc.ncs.dup.push(c); } seen[c] = 1; });

  if (!doc.courses.length) doc.warnings.push('교과목별 상세 페이지(교수계획서)를 찾지 못했습니다. 텍스트가 없는 PDF이거나 형식이 다른 파일일 수 있습니다.');
  return doc;
}

function parseDetail(rows, pi, doc) {
  var iName = -1, iHdr = -1;
  rows.forEach(function (r, i) {
    if (iName < 0 && r.cells.some(function (c) { return nz(c.s) === '교과목명'; })) iName = i;
    if (iHdr < 0 && r.cells.some(function (c) { return nz(c.s) === '대상학과'; })) iHdr = i;
  });
  var name = rows[iName + 1] ? rows[iName + 1].text : '';
  var data = rows[iHdr + 1] || { cells: [] };
  var hc = data.cells.filter(function (c) { return /^\d+\(\d+\)$/.test(nz(c.s)); })[0];
  var hm = hc ? nz(hc.s).match(/^(\d+)\((\d+)\)$/) : null;

function readPdf() {
  if (typeof pdfjsLib === 'undefined') { $('readOut').innerHTML = '<div class="err">PDF 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</div>'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var btn = $('btnRead'); btn.disabled = true; $('readOut').innerHTML = ''; $('readProg').textContent = '파일을 여는 중...';
  var fr = new FileReader();
  fr.onerror = function () { fail('파일을 읽지 못했습니다.'); };
  fr.onload = function () {
    pdfjsLib.getDocument({ data: new Uint8Array(fr.result) }).promise.then(function (pdf) {
      var pages = [], n = pdf.numPages, chars = 0;
      var next = function (p) {
        if (p > n) return Promise.resolve();
        $('readProg').textContent = '읽는 중... ' + p + ' / ' + n + '쪽';
        return pdf.getPage(p).then(function (pg) { return pg.getTextContent(); }).then(function (tc) { chars += tc.items.length; pages.push(buildRows(tc.items)); return next(p + 1); });
      };
      return next(1).then(function () {
        if (chars < 20) throw new Error('텍스트를 읽을 수 없는 PDF입니다(스캔 파일). 시스템에서 다시 출력해 주세요.');
        var doc = parseDoc(pages);
        chk.doc = doc; $('readProg').textContent = '읽기 완료 (' + n + '쪽)'; showRead();
      });
    }).catch(function (e) { fail(e.message || String(e)); });
  };
  fr.readAsArrayBuffer(chk.file);
  function fail(m) { $('readProg').textContent = ''; $('readOut').innerHTML = '<div class="err">읽기 실패: ' + esc(m) + '</div>'; btn.disabled = false; }
}

  var rc = $('resCard'); rc.style.display = 'block';
  var meta = Object.assign({ course: COURSE_NAMES[curCourse] }, chk.meta);
  rc.innerHTML = resultHtml(chk.items, meta) + '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="b" id="btnSaveRes" onclick="saveRes()">결과 저장</button><button class="g" onclick="printRes()">결과 인쇄(A4 가로)</button><button class="g" onclick="csvRes()">CSV 다운로드</button></div><div class="msg" id="saveMsg"></div>';
  rc.querySelectorAll('input[data-m]').forEach(function (n) {
    n.onchange = function () { chk.items[n.dataset.m].verdict = n.checked ? '적합' : '확인필요'; chk.saved = false; renderResult(); };
  });
}
function saveRes() {
  var b = $('btnSaveRes'); b.disabled = true; $('saveMsg').textContent = '저장 중...';
  var s = summarize(chk.items);
  var courses = chk.doc.courses.map(function (c) { return { name: c.name, cat: c.cat, req: c.req, hours: c.hours, credits: c.credits, page: c.page }; });
  api({ action: 'saveResult', course: curCourse, campus: chk.meta.campus, dept: chk.meta.dept, manager: chk.meta.manager, type: chk.meta.type, fileName: chk.file ? chk.file.name : '',
    result: { summary: s, items: chk.items, courses: courses, cover: chk.doc.cover } })
    .then(function (j) { $('saveMsg').innerHTML = j.ok ? '<span style="color:#16a34a">' + esc(j.message) + ' 검수번호 ' + esc(j.data.id) + '</span>' : '<span style="color:#dc2626">' + esc(j.message) + '</span>'; if (j.ok) toast('저장되었습니다.'); })
    .catch(function (e) { $('saveMsg').innerHTML = '<span style="color:#dc2626">' + esc(e.message) + '</span>'; })
    .then(function () { b.disabled = false; });
}
function printRes() {
  var meta = Object.assign({ course: COURSE_NAMES[curCourse] }, chk.meta);
  $('printArea').innerHTML = '<div style="font-size:11px;margin-bottom:4px">한국폴리텍대학 교육운영계획서 검토 지원 프로그램 · 검수일 ' + new Date().toLocaleDateString('ko-KR') + ' · 담당자 ' + esc(meta.manager) + '</div>' + resultHtml(chk.items, meta, true);
  document.body.classList.add('printing'); setTimeout(function () { window.print(); document.body.classList.remove('printing'); }, 100);
}
function csvEsc(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(name, rows) {
  var txt = '\ufeff' + rows.map(function (r) { return r.map(csvEsc).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function csvRes() {
  var rows = [['과정', '캠퍼스', '학과', '담당자', '항목', '판정', '기준값', '실제값', '차이', '사유', '근거']];
  chk.items.forEach(function (i) { rows.push([COURSE_NAMES[curCourse], chk.meta.campus, chk.meta.dept, chk.meta.manager, i.name, i.verdict, i.std, i.act, i.diff, i.reason, i.ref]); });
  downloadCsv('검수결과_' + chk.meta.campus + '_' + chk.meta.dept + '.csv', rows);
}

/* ============ 검수 내역 ============ */
var hist = [];
function gotoHistory() {
  if (!token) { afterLogin = 'history'; return adminGate('history'); }
  show('s-history'); $('hCount').textContent = '불러오는 중...';
  loadCampuses().then(function () {
    var s = $('hCampus'), keep = s.value; fillCampusSelect(s, '전체'); s.value = keep;
    return api({ action: 'listResults' });
  }).then(function (j) {
    if (j.code === 'AUTH') { needLogin(); return; }
    if (!j.ok) throw new Error(j.message);
    hist = j.data; renderHistory();
  }).catch(function (e) { $('hCount').textContent = e.message; });
}
function filtered() {
  var c = $('hCourse').value, ca = $('hCampus').value, v = $('hVerdict').value, f = $('hFrom').value.trim(), t = $('hTo').value.trim(), q = $('hQ').value.trim();
  return hist.filter(function (r) {
    if (c && r.course !== c) return false; if (ca && r.campus !== ca) return false; if (v && r.verdict !== v) return false;
    var d = r.at.slice(0, 10); if (f && d < f) return false; if (t && d > t) return false;
    if (q && (r.dept + r.manager + r.id + r.file).indexOf(q) < 0) return false; return true;
  });
}
function renderHistory() {
  var list = filtered(), h = '<tr><th>검수번호</th><th>검수일시</th><th>과정</th><th>캠퍼스</th><th>학과</th><th>담당자</th><th>종합판정</th><th>부적합</th><th>확인필요</th><th>재검수</th></tr>';
  var seen = {}; var first = {};
  hist.slice().reverse().forEach(function (r) { var k = r.course + '|' + r.campus + '|' + r.dept; if (first[k] == null) first[k] = r.id; });
  list.forEach(function (r) {
    var k = r.course + '|' + r.campus + '|' + r.dept;
    h += '<tr style="cursor:pointer" onclick="showDetail(\'' + esc(r.id) + '\')"><td>' + esc(r.id) + '</td><td>' + esc(r.at) + '</td><td>' + esc(r.course) + '</td><td>' + esc(r.campus) + '</td><td>' + esc(r.dept) + '</td><td>' + esc(r.manager) + '</td><td><span class="pill ' + VCLS[r.verdict] + '">' + esc(r.verdict) + '</span></td><td>' + r.bad + '</td><td>' + r.chk + '</td><td>' + (first[k] !== r.id ? '재검수' : '') + '</td></tr>';
  });
  $('hTable').innerHTML = h; $('hCount').textContent = list.length + '건 (전체 ' + hist.length + '건)';
}
function historyCsv() {
  var rows = [['검수번호', '검수일시', '과정', '캠퍼스', '학과', '담당자', '편성유형', '종합판정', '적합', '부적합', '확인필요', '파일명']];
  filtered().forEach(function (r) { rows.push([r.id, r.at, r.course, r.campus, r.dept, r.manager, r.type, r.verdict, r.ok, r.bad, r.chk, r.file]); });
  downloadCsv('검수내역.csv', rows);
}
function showDetail(id) {
  var r = hist.filter(function (x) { return x.id === id; })[0];
  $('detailBody').innerHTML = '<div class="note">불러오는 중...</div>'; $('mDetail').classList.add('on');
  api({ action: 'getResultDetail', id: id }).then(function (j) {
    if (j.code === 'AUTH') { $('mDetail').classList.remove('on'); return needLogin(); }
    if (!j.ok) throw new Error(j.message);
    var d = j.data, h = resultHtml(d.items, { course: r.course, campus: r.campus, dept: r.dept }, true);
    h += '<h3 style="margin-top:16px">읽어 온 교과 목록</h3><div class="tw"><table><tr><th>#</th><th>교과목명</th><th>교과구분</th><th>시간</th><th>학점</th><th>쪽</th></tr>' +
      (d.courses || []).map(function (c, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(c.name) + '</td><td>' + esc(c.cat) + ' ' + esc(c.req) + '</td><td>' + esc(c.hours) + '</td><td>' + esc(c.credits) + '</td><td>' + esc(c.page) + '</td></tr>'; }).join('') + '</table></div>';
    $('detailBody').innerHTML = '<div class="note">검수번호 ' + esc(id) + ' · ' + esc(r.at) + ' · 담당자 ' + esc(r.manager) + '</div>' + h;
  }).catch(function (e) { $('detailBody').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

</script>
